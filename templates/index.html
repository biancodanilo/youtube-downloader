<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader & Playlist Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #121215;
            --surface-hover: #18181c;
            --border: rgba(255, 255, 255, 0.07);
            --border-focus: rgba(255, 255, 255, 0.22);
            --text: #ededed;
            --text-muted: #888890;
            --text-dim: #55555e;
            --accent-bg: #ffffff;
            --accent-text: #09090b;
            --danger: #ef4444;
            --success: #10b981;
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glow background effect */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 550px;
            height: 380px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .app-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
        }

        /* Minimalist Header */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            color: var(--text);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text);
        }

        .brand-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 12px;
        }

        .brand-version {
            text-align: right;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 150;
            margin-bottom: 5px;
        }

        /* Main Card Container */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* URL Fetch Bar */
        .fetch-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
            transition: var(--transition);
        }

        .url-input {
            width: 100%;
            padding: 13px 40px 13px 40px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        .url-input::placeholder {
            color: var(--text-dim);
        }

        .url-input:focus {
            border-color: var(--border-focus);
            background: rgba(0, 0, 0, 0.55);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        .btn-fetch {
            padding: 0 18px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: var(--transition);
        }

        .btn-fetch:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-fetch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Items / Playlist Panel */
        .playlist-panel {
            display: none;
            margin-bottom: 20px;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }

        .playlist-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
        }

        .playlist-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.775rem;
            color: var(--text-muted);
        }

        .toggle-all-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-all-label input[type="checkbox"],
        .item-checkbox {
            appearance: none;
            width: 15px;
            height: 15px;
            border: 1px solid var(--border-focus);
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
        }

        .toggle-all-label input[type="checkbox"]:checked,
        .item-checkbox:checked {
            background: var(--text);
            border-color: var(--text);
        }

        .toggle-all-label input[type="checkbox"]:checked::after,
        .item-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid #000;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Scrollable Items List */
        .items-list {
            max-height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .items-list::-webkit-scrollbar {
            width: 4px;
        }

        .items-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 99px;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: var(--transition);
        }

        .item-row:hover {
            border-color: rgba(255, 255, 255, 0.14);
            background: rgba(0, 0, 0, 0.35);
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .item-title-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 4px 8px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            outline: none;
            transition: var(--transition);
        }

        .item-title-input:hover {
            border-color: var(--border);
        }

        .item-title-input:focus {
            border-color: var(--border-focus);
            background: rgba(0, 0, 0, 0.6);
        }

        .item-meta {
            font-size: 0.725rem;
            color: var(--text-muted);
            padding-left: 8px;
        }

        /* Segmented Control Format Selector */
        .format-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .format-option {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .format-option svg {
            width: 15px;
            height: 15px;
            opacity: 0.6;
            transition: var(--transition);
        }

        .format-option:hover {
            color: var(--text);
        }

        .format-option.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .format-option.active svg {
            opacity: 1;
        }

        /* Download Button */
        .btn-primary {
            width: 100%;
            padding: 13px;
            border-radius: var(--radius-md);
            border: none;
            background: var(--accent-bg);
            color: var(--accent-text);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(255, 255, 255, 0.12);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status Card */
        .status-card {
            margin-top: 20px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            display: none;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-header {
            margin-bottom: 12px;
        }

        .status-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .status-meta {
            font-size: 0.725rem;
            color: var(--text-muted);
        }

        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--text);
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .status-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.725rem;
            color: var(--text-muted);
        }

        .status-percent {
            font-weight: 600;
            color: var(--text);
        }

        /* Floating Toast Notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(40px);
            background: #18181c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            padding: 9px 18px;
            border-radius: 99px;
            font-size: 0.825rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .toast-icon {
            width: 15px;
            height: 15px;
            color: var(--success);
            flex-shrink: 0;
        }

        .toast.error .toast-icon {
            color: var(--danger);
        }

        .app-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.725rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/>
                <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>
            </svg>
            <span class="brand-title">Downloader</span>
        </div>
        <p class="brand-subtitle">Baixe vídeos e playlists com edição de títulos V1.0</p>
        <p class="brand-version">V1.0</p>

        <div class="card">
            <!-- Step 1: Input URL & Fetch Button -->
            <div class="fetch-bar">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                    <input type="text" id="url" class="url-input" placeholder="Cole o link da playlist ou vídeo..." required autocomplete="off">
                </div>
                <button type="button" class="btn-fetch" id="fetchBtn" onclick="fetchInfo()">
                    <span id="fetchBtnText">Carregar</span>
                </button>
            </div>

            <!-- Step 2: Playlist & Editable Items List -->
            <div class="playlist-panel" id="playlistPanel">
                <div class="playlist-header">
                    <span class="playlist-title" id="playlistTitle">Conteúdo da Playlist</span>
                    <div class="playlist-actions">
                        <label class="toggle-all-label">
                            <input type="checkbox" id="toggleAll" checked onchange="toggleSelectAll(this.checked)">
                            <span>Marcar todos</span>
                        </label>
                        <span id="selectedCount">(0 selecionados)</span>
                    </div>
                </div>

                <div class="items-list" id="itemsList">
                    <!-- Items rendered dynamically -->
                </div>
            </div>

            <!-- Format Selector -->
            <div class="format-selector">
                <button type="button" class="format-option active" id="fmt-mp4" onclick="selectFormat('mp4', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"/>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                    </svg>
                    <span>Vídeo MP4</span>
                </button>
                <button type="button" class="format-option" id="fmt-mp3" onclick="selectFormat('mp3', this)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 18V5l12-2v13"/>
                        <circle cx="6" cy="18" r="3"/>
                        <circle cx="18" cy="16" r="3"/>
                    </svg>
                    <span>Áudio MP3</span>
                </button>
            </div>

            <!-- Download Action Button -->
            <button type="button" class="btn-primary" id="startBtn" onclick="startDownload()" disabled>
                <div class="btn-spinner" id="btnSpinner"></div>
                <svg id="btnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span id="btnText">Carregue o link primeiro</span>
            </button>

            <!-- Download Status Card -->
            <div class="status-card" id="statusBox">
                <div class="status-header">
                    <div class="status-title" id="videoTitle">Iniciando...</div>
                    <div class="status-meta" id="videoMeta">Aguarde...</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressBar"></div>
                </div>
                <div class="status-footer">
                    <span id="statusMessage">Conectando...</span>
                    <span class="status-percent" id="progressPercent">0%</span>
                </div>
            </div>
        </div>

        <div class="app-footer">
            Salvo diretamente na pasta local <code>downloads/</code>
        </div>
    </div>

    <!-- Floating Toast Notification -->
    <div class="toast" id="toast">
        <svg class="toast-icon" id="toastIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span id="toastMessage">Operação concluída!</span>
    </div>

    <script>
        let selectedFormat = 'mp4';
        let isDownloading = false;
        let fetchedItems = [];

        function selectFormat(format, element) {
            if (isDownloading) return;
            selectedFormat = format;
            document.querySelectorAll('.format-option').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            
            toast.className = 'toast';
            if (isError) {
                toast.classList.add('error');
                toastIcon.innerHTML = '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>';
            } else {
                toastIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
            }
            
            msgSpan.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        async function fetchInfo() {
            const urlInput = document.getElementById('url');
            const url = urlInput.value.trim();
            
            if (!url) {
                showToast('Insira um link do YouTube válido', true);
                return;
            }

            const fetchBtn = document.getElementById('fetchBtn');
            const fetchBtnText = document.getElementById('fetchBtnText');
            
            fetchBtn.disabled = true;
            fetchBtnText.textContent = 'Buscando...';
            
            try {
                const response = await fetch('/api/fetch_info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao carregar informações');
                }

                fetchedItems = data.items || [];
                renderPlaylistItems(data.playlist_title, data.is_playlist);
                
                showToast(`${fetchedItems.length} item(ns) encontrado(s)!`);

            } catch (err) {
                showToast(err.message, true);
            } finally {
                fetchBtn.disabled = false;
                fetchBtnText.textContent = 'Carregar';
            }
        }

        function renderPlaylistItems(title, isPlaylist) {
            const playlistPanel = document.getElementById('playlistPanel');
            const playlistTitle = document.getElementById('playlistTitle');
            const itemsList = document.getElementById('itemsList');
            const startBtn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');

            playlistTitle.textContent = isPlaylist ? `Playlist: ${title}` : title;
            itemsList.innerHTML = '';

            fetchedItems.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
                    <input type="checkbox" class="item-checkbox" id="item-chk-${index}" checked onchange="updateSelectedCount()">
                    <div class="item-details">
                        <input type="text" class="item-title-input" id="item-title-${index}" value="${escapeHtml(item.title)}" placeholder="Nome do arquivo...">
                        <div class="item-meta">${item.uploader} • ${item.duration}</div>
                    </div>
                `;
                itemsList.appendChild(row);
            });

            playlistPanel.style.display = 'block';
            updateSelectedCount();
            startBtn.disabled = false;
        }

        function escapeHtml(text) {
            return String(text).replace(/"/g, '&quot;');
        }

        function toggleSelectAll(checked) {
            document.querySelectorAll('.item-checkbox').forEach(chk => chk.checked = checked);
            updateSelectedCount();
        }

        function updateSelectedCount() {
            const checkboxes = document.querySelectorAll('.item-checkbox');
            let selected = 0;
            checkboxes.forEach(chk => { if (chk.checked) selected++; });

            document.getElementById('selectedCount').textContent = `(${selected} selecionados)`;
            const toggleAll = document.getElementById('toggleAll');
            toggleAll.checked = selected === checkboxes.length && checkboxes.length > 0;

            const startBtn = document.getElementById('startBtn');
            const btnText = document.getElementById('btnText');

            if (selected > 0) {
                startBtn.disabled = false;
                btnText.textContent = `Baixar ${selected} selecionado(s)`;
            } else {
                startBtn.disabled = true;
                btnText.textContent = 'Selecione ao menos 1 item';
            }
        }

        async function startDownload() {
            if (isDownloading || fetchedItems.length === 0) return;

            const selectedPayload = [];
            fetchedItems.forEach((item, index) => {
                const chk = document.getElementById(`item-chk-${index}`);
                const titleInput = document.getElementById(`item-title-${index}`);
                
                if (chk && chk.checked) {
                    const customTitle = titleInput ? titleInput.value.trim() : item.title;
                    selectedPayload.push({
                        url: item.url,
                        title: item.title,
                        custom_title: customTitle || item.title
                    });
                }
            });

            if (selectedPayload.length === 0) {
                showToast('Selecione pelo menos um vídeo para baixar!', true);
                return;
            }

            isDownloading = true;
            document.getElementById('url').disabled = true;
            document.getElementById('fetchBtn').disabled = true;
            
            const startBtn = document.getElementById('startBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            
            startBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnIcon.style.display = 'none';
            btnText.textContent = 'Iniciando downloads...';
            
            const statusBox = document.getElementById('statusBox');
            const videoTitle = document.getElementById('videoTitle');
            const videoMeta = document.getElementById('videoMeta');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const statusMessage = document.getElementById('statusMessage');

            statusBox.style.display = 'block';
            videoTitle.textContent = `Iniciando lote de ${selectedPayload.length} item(ns)...`;
            videoMeta.textContent = 'Preparando servidor...';
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            statusMessage.textContent = 'Conectando...';

            try {
                const response = await fetch('/api/download_batch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: selectedPayload, format: selectedFormat })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro ao iniciar lote de download');
                }

                monitorBatchProgress(data.task_id, data.total_items);

            } catch (err) {
                showToast(err.message, true);
                resetUI();
            }
        }

        function resetUI() {
            isDownloading = false;
            document.getElementById('url').disabled = false;
            document.getElementById('fetchBtn').disabled = false;
            
            const startBtn = document.getElementById('startBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');
            
            startBtn.disabled = false;
            btnSpinner.style.display = 'none';
            btnIcon.style.display = 'block';
            updateSelectedCount();
        }

        function monitorBatchProgress(taskId, totalItems) {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const videoTitle = document.getElementById('videoTitle');
            const videoMeta = document.getElementById('videoMeta');
            const statusMessage = document.getElementById('statusMessage');

            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/progress/${taskId}`);
                    const status = await response.json();

                    if (status.state === 'downloading' || status.state === 'processing') {
                        videoTitle.textContent = `Item ${status.current_index} de ${status.total_items}: ${status.current_title}`;
                        videoMeta.textContent = `Velocidade: ${status.speed} • ETA: ${status.eta}`;
                        
                        const overall = status.overall_percent || 0;
                        progressBar.style.width = `${overall}%`;
                        progressPercent.textContent = `${Math.round(overall)}%`;
                        statusMessage.textContent = status.state === 'processing' ? 'Processando FFmpeg...' : 'Baixando...';
                    } else if (status.state === 'completed') {
                        clearInterval(interval);
                        progressBar.style.width = '100%';
                        progressPercent.textContent = '100%';
                        videoTitle.textContent = 'Download em Lote Concluído!';
                        videoMeta.textContent = `${status.completed_count} concluído(s), ${status.failed_count} falha(s)`;
                        statusMessage.textContent = 'Finalizado!';
                        showToast(`Todos os ${status.completed_count} arquivos foram salvos na pasta downloads!`);
                        resetUI();
                    } else if (status.state === 'failed') {
                        clearInterval(interval);
                        statusMessage.textContent = 'Falha na tarefa.';
                        showToast(status.error || 'Erro no download em lote', true);
                        resetUI();
                    }
                } catch (e) {
                    console.error("Erro no monitoramento:", e);
                }
            }, 1000);
        }
    </script>
</body>
</html>
