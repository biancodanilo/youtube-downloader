<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - Antigravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #06020f 100%);
            --panel-bg: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #ff0055;
            --secondary: #7000ff;
            --accent-gradient: linear-gradient(90deg, #ff0055 0%, #7000ff 100%);
            --text-main: #ffffff;
            --text-muted: #a09cb0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow: 0 24px 60px rgba(112, 0, 255, 0.15);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }

        .format-selection {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .format-card {
            flex: 1;
            padding: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .format-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--secondary);
            transform: translateY(-2px);
        }

        .format-card.active {
            background: rgba(112, 0, 255, 0.1);
            border-color: var(--secondary);
            box-shadow: 0 0 15px rgba(112, 0, 255, 0.2);
        }

        .format-card input {
            display: none;
        }

        .format-icon {
            font-size: 1.8rem;
        }

        .format-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .format-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: var(--accent-gradient);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(112, 0, 255, 0.2);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 0, 85, 0.3);
            filter: brightness(1.1);
        }

        .btn-download:active {
            transform: translateY(1px);
        }

        /* Status & Progress */
        .status-container {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            display: none;
            text-align: left;
        }

        .video-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .video-details {
            flex: 1;
        }

        .video-title {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .video-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-gradient);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Notification Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            background: #10b981;
            border-radius: 12px;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.error {
            background: #ef4444;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YouTube Downloader</h1>
        <div class="subtitle">Baixe vídeos e áudios do YouTube direto para o seu servidor</div>

        <div class="input-group">
            <input type="text" id="url" placeholder="Cole o link do YouTube aqui..." required autocomplete="off">
        </div>

        <div class="format-selection">
            <div class="format-card active" onclick="selectFormat('mp4', this)">
                <span class="format-icon">🎬</span>
                <span class="format-name">Vídeo MP4</span>
                <span class="format-desc">Melhor Qualidade</span>
            </div>
            <div class="format-card" onclick="selectFormat('mp3', this)">
                <span class="format-icon">🎵</span>
                <span class="format-name">Áudio MP3</span>
                <span class="format-desc">192kbps Estéreo</span>
            </div>
        </div>

        <button class="btn-download" id="startBtn" onclick="startDownload()">Iniciar Download</button>

        <div class="status-container" id="statusBox">
            <div class="video-info">
                <div class="video-details">
                    <div class="video-title" id="videoTitle">Obtendo informações...</div>
                    <div class="video-meta" id="videoMeta">Aguarde um momento...</div>
                </div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <div class="status-text">
                <span id="statusMessage">Processando...</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastMessage">Download concluído!</span>
    </div>

    <script>
        let selectedFormat = 'mp4';
        let isDownloading = false;

        function selectFormat(format, element) {
            if (isDownloading) return;
            selectedFormat = format;
            document.querySelectorAll('.format-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgSpan = document.getElementById('toastMessage');
            
            toast.className = 'toast';
            if (isError) toast.classList.add('error');
            
            msgSpan.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        async function startDownload() {
            const urlInput = document.getElementById('url');
            const url = urlInput.value.trim();
            
            if (!url) {
                showToast('Por favor, insira um link válido do YouTube!', true);
                return;
            }

            if (isDownloading) return;

            isDownloading = true;
            urlInput.disabled = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').innerText = 'Baixando...';
            document.getElementById('startBtn').style.opacity = '0.7';
            
            const statusBox = document.getElementById('statusBox');
            const videoTitle = document.getElementById('videoTitle');
            const videoMeta = document.getElementById('videoMeta');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const statusMessage = document.getElementById('statusMessage');

            statusBox.style.display = 'block';
            videoTitle.textContent = 'Obtendo informações...';
            videoMeta.textContent = 'Carregando metadados do YouTube...';
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            statusMessage.textContent = 'Inicializando...';

            try {
                // Iniciar o download via chamada de API no servidor
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format: selectedFormat })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Erro desconhecido');
                }

                // Vídeo encontrado
                videoTitle.textContent = data.title;
                videoMeta.textContent = `Canal: ${data.uploader} | Duração: ${data.duration}`;
                
                // Começar a monitorar o progresso
                const taskId = data.task_id;
                monitorProgress(taskId);

            } catch (err) {
                showToast(`Erro: ${err.message}`, true);
                resetUI();
            }
        }

        function resetUI() {
            isDownloading = false;
            document.getElementById('url').disabled = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('startBtn').innerText = 'Iniciar Download';
            document.getElementById('startBtn').style.opacity = '1';
        }

        function monitorProgress(taskId) {
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const statusMessage = document.getElementById('statusMessage');

            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/progress/${taskId}`);
                    const status = await response.json();

                    if (status.state === 'downloading') {
                        progressBar.style.width = `${status.percent}%`;
                        progressPercent.textContent = `${status.percent}%`;
                        statusMessage.textContent = `Baixando... (${status.speed} | Resta: ${status.eta})`;
                    } else if (status.state === 'processing') {
                        progressBar.style.width = '99%';
                        progressPercent.textContent = '99%';
                        statusMessage.textContent = 'Processando arquivos finais com o FFmpeg...';
                    } else if (status.state === 'completed') {
                        clearInterval(interval);
                        progressBar.style.width = '100%';
                        progressPercent.textContent = '100%';
                        statusMessage.textContent = 'Download finalizado!';
                        showToast('Arquivo salvo na pasta downloads com sucesso!');
                        resetUI();
                    } else if (status.state === 'failed') {
                        clearInterval(interval);
                        statusMessage.textContent = 'Falha no download.';
                        showToast(`Erro no download: ${status.error}`, true);
                        resetUI();
                    }
                } catch (e) {
                    console.error("Erro ao verificar progresso:", e);
                }
            }, 1000); // verifica a cada 1 segundo
        }
    </script>
</body>
</html>
